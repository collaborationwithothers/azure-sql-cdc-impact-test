name: validate

# Runs on every pull request and on main. Has no Azure access and no secrets.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    # Compensating control. Secret scanning and push protection are disabled on
    # this repository by an enterprise policy. This job scans the full history
    # of the branch with gitleaks and fails on any finding.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum pinned)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Scan git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --config .gitleaks.toml -v .
      - name: Scan for Azure GUID identifiers
        # Subscription and tenant IDs must never be committed. Any GUID in a
        # tracked file fails the build unless the line is marked allow-guid.
        run: scripts/check-identifiers.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck scripts/*.sh

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [persistent, ephemeral]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
      - name: Check whether the layer exists
        id: exists
        run: |
          if [ -n "$(ls infra/${{ matrix.layer }}/*.tf 2>/dev/null)" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - name: fmt
        if: steps.exists.outputs.yes == 'true'
        run: terraform -chdir=infra/${{ matrix.layer }} fmt -check -recursive -diff
      - name: init
        if: steps.exists.outputs.yes == 'true'
        run: terraform -chdir=infra/${{ matrix.layer }} init -backend=false -input=false
      - name: validate
        if: steps.exists.outputs.yes == 'true'
        run: terraform -chdir=infra/${{ matrix.layer }} validate

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build CdcImpact.slnx -c Release
      - name: Unit tests
        run: dotnet test --project tests/unit/UnitTests.csproj -c Release
      - name: Container tests (SQL Server in Docker)
        run: dotnet test --project tests/containers/ContainerTests.csproj -c Release

  rig-containers:
    # Builds the rig and Debezium images, runs the Python tests against SQL
    # Server, and checks the Debezium control protocol.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/rig/run-container-tests.sh
